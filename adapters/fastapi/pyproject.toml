[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin-kit-fastapi"
version = "0.1.0"
description = "FastAPI / Starlette adapter for AdminKit - API-driven admin dashboard studio"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "AdminKit Team" },
]
dependencies = [
    "fastapi>=0.100.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.20.0",
    "httpx>=0.25.0",
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["admin_kit_fastapi"]

