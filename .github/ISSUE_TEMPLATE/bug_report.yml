name: Bug Report
description: Create a report to help us reproduce and fix an issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package or adapter did this issue occur in?
      options:
        - "@admin-kit/core"
        - "@admin-kit/cli"
        - "@admin-kit/react"
        - "@admin-kit/express"
        - "admin-kit-fastapi"
        - "other / workspace"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AdminKit Version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Detailed steps to reproduce the behavior, or a link to a minimal repository.
      placeholder: |
        1. Run `npx @admin-kit/cli pull --source=...`
        2. Mount Express middleware at `/admin`
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant terminal output or browser console logs.
      render: shell

